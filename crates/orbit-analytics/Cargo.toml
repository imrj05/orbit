[package]
name = "orbit-analytics"
version = "0.2.4"
description = "Privacy-first, provider-independent product analytics for Orbit (Countly HTTP client)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# v4 UUIDs for the pseudonymous installation id and the per-launch session id.
# `uuid` is already in the workspace graph through gpui/zbus, so naming it here
# adds no new packages.
uuid = { version = "1", features = ["v4"] }
# Endpoint parsing and HTTPS enforcement; already in the graph through the app.
url = "2.5"
# The same zed-reqwest the app already links, so no new TLS stack is pulled in.
# Analytics run on a dedicated worker thread through the blocking client — the
# GPUI executor is never touched.
reqwest = { version = "0.12.15-zed", package = "zed-reqwest", default-features = false, features = [
    "blocking",
    "rustls-tls-native-roots",
    "rustls-tls-webpki-roots",
] }
