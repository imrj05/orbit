transcript_export.pdf_title: "PDF로 내보내기"
transcript_export.pdf_preview_question: "기본 PDF 뷰어에서 이 PDF를 미리 볼까요? 예를 누르면 해당 앱에서 임시 사본을 열고, 아니요는 미리보기를 건너뛰며, 취소는 내보내기를 중지합니다. Orbit은 보통 종료할 때 사본을 제거하지만 비정상 종료 후에는 남아 있을 수 있습니다. 뷰어는 자체 설정에 따라 파일을 처리할 수 있습니다."
transcript_export.pdf_preview_done: "PDF를 검토한 후 확인을 선택해 저장 위치를 고르거나 취소를 선택해 중지하세요."
transcript_export.pdf_response_disclosure: "응답은 첨부된 이미지와 함께 오프라인으로 렌더링됩니다. 링크된 이미지는 생략되고 애니메이션 이미지는 첫 프레임을 사용합니다. 가로나 세로가 4000픽셀을 넘는 이미지는 내보낼 수 없습니다. 일부 문자는 사용할 수 없을 수 있으며 아랍어, 인도계 문자 및 기타 복잡한 문자 체계는 올바르게 표시되지 않을 수 있습니다."
transcript_export.pdf_transcript_disclosure: "보이는 대화만 내보냅니다. 이전 메시지는 압축 요약으로 대체되었을 수 있습니다. 첨부된 이미지는 포함되지만 링크된 이미지는 생략됩니다. 애니메이션 이미지는 첫 프레임을 사용합니다. 가로나 세로가 4000픽셀을 넘는 이미지는 내보낼 수 없습니다. 일부 문자는 사용할 수 없을 수 있으며 아랍어, 인도계 문자 및 기타 복잡한 문자 체계는 올바르게 표시되지 않을 수 있습니다. 렌더링은 오프라인으로 수행됩니다."
