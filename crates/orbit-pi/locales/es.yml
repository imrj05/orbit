transcript_export.pdf_title: "Exportar como PDF"
transcript_export.pdf_preview_question: "¿Previsualizar este PDF en tu visor de PDF predeterminado? Sí abre una copia temporal en esa aplicación; No omite la vista previa; Cancelar detiene la exportación. Orbit normalmente elimina la copia al salir; puede quedar tras un cierre inesperado. El visor puede tratar los archivos según sus propios ajustes."
