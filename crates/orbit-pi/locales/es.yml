transcript_export.pdf_response_disclosure: "La respuesta se renderiza sin conexión con las imágenes adjuntas. Las imágenes enlazadas se omiten; las imágenes animadas usan su primer fotograma. Las imágenes de más de 4000 píxeles en cualquier dimensión no se pueden exportar. Puede que algunos caracteres no estén disponibles; el árabe, las escrituras índicas y otras escrituras complejas pueden mostrarse incorrectamente."
transcript_export.pdf_transcript_disclosure: "Solo se exporta la conversación visible; los mensajes anteriores pueden haberse sustituido por un resumen de compactación. Se incluyen las imágenes adjuntas, pero se omiten las enlazadas. Las imágenes animadas usan su primer fotograma. Las imágenes de más de 4000 píxeles en cualquier dimensión no se pueden exportar. Puede que algunos caracteres no estén disponibles; el árabe, las escrituras índicas y otras escrituras complejas pueden mostrarse incorrectamente. El renderizado se hace sin conexión."
