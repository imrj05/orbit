worktree.howto.title: "Cómo funcionan los worktrees"
worktree.howto.intro: "Un worktree es una segunda copia de trabajo de este repositorio en su propia rama. Comparte un mismo historial de Git, así que puedes ejecutar varias sesiones de pi en paralelo sin guardar cambios ni cambiar de rama."
worktree.howto.create: "Crea uno con Worktree: ponle nombre a la carpeta, elige una rama y dónde vivirá."
worktree.howto.open: "Abre una fila para trabajar allí. El Explorador, Archivos, la terminal, Git, Revisión y el agente siguen esa carpeta."
worktree.howto.setup: "Opcional: añade .orbit/worktree-setup.sh para ejecutar tus propios pasos tras la creación, por ejemplo enlazar .env o compartir node_modules."
worktree.howto.rename: "Renombrar solo mueve la carpeta; la rama de Git siempre conserva su nombre."
