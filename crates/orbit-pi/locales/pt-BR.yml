worktree.howto.title: "Como funcionam os worktrees"
worktree.howto.intro: "Um worktree é uma segunda cópia de trabalho deste repositório em seu próprio branch. Ele compartilha um único histórico Git, então você pode executar várias sessões do pi em paralelo sem guardar alterações nem trocar de branch."
