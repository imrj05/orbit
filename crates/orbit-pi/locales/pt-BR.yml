worktree.howto.setup: "Opcional: adicione .orbit/worktree-setup.sh para executar suas próprias etapas após a criação, por exemplo vincular .env ou compartilhar node_modules."
worktree.howto.rename: "Renomear move apenas a pasta; o branch do Git sempre mantém o nome."
