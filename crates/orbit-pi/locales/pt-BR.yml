transcript_export.pdf_title: "Exportar como PDF"
transcript_export.pdf_preview_question: "Visualizar este PDF no seu leitor de PDF padrão? Sim abre uma cópia temporária nesse app; Não pula a prévia; Cancelar interrompe a exportação. O Orbit normalmente remove a cópia ao fechar; ela pode permanecer após uma falha. O leitor pode tratar os arquivos de acordo com as próprias configurações."
