transcript_export.pdf_response_disclosure: "A resposta é renderizada offline com as imagens anexadas. Imagens vinculadas são omitidas; imagens animadas usam o primeiro quadro. Imagens com mais de 4000 pixels em qualquer dimensão não podem ser exportadas. Alguns caracteres podem não estar disponíveis; árabe, escritas índicas e outras escritas complexas podem ser exibidas incorretamente."
transcript_export.pdf_transcript_disclosure: "Somente a conversa visível é exportada; mensagens anteriores podem ter sido substituídas por um resumo de compactação. Imagens anexadas são incluídas, mas imagens vinculadas são omitidas. Imagens animadas usam o primeiro quadro. Imagens com mais de 4000 pixels em qualquer dimensão não podem ser exportadas. Alguns caracteres podem não estar disponíveis; árabe, escritas índicas e outras escritas complexas podem ser exibidas incorretamente. A renderização é offline."
