transcript_export.pdf_preview_question: "Открыть этот PDF для предпросмотра в программе просмотра PDF по умолчанию? «Да» открывает временную копию в этом приложении; «Нет» пропускает предпросмотр; «Отмена» прекращает экспорт. Обычно Orbit удаляет копию при выходе; после сбоя она может остаться. Программа просмотра может обрабатывать файлы согласно своим настройкам."
transcript_export.pdf_preview_done: "Просмотрев PDF, нажмите «ОК», чтобы выбрать место сохранения, или «Отмена», чтобы прекратить."
transcript_export.pdf_response_disclosure: "Ответ отрисовывается офлайн с прикреплёнными изображениями. Изображения по ссылкам не включаются; у анимированных изображений используется первый кадр. Изображения больше 4000 пикселей по любой стороне экспортировать нельзя. Некоторые символы могут быть недоступны; арабское, индийские и другие сложные письменности могут отображаться неправильно."
transcript_export.pdf_transcript_disclosure: "Экспортируется только видимая часть диалога; более ранние сообщения могли быть заменены сводкой сжатия. Прикреплённые изображения включаются, а изображения по ссылкам — нет. У анимированных изображений используется первый кадр. Изображения больше 4000 пикселей по любой стороне экспортировать нельзя. Некоторые символы могут быть недоступны; арабское, индийские и другие сложные письменности могут отображаться неправильно. Отрисовка выполняется офлайн."
