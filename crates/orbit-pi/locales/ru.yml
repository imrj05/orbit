worktree.howto.title: "Как работают рабочие деревья"
worktree.howto.intro: "Рабочее дерево — это вторая рабочая копия этого репозитория на отдельной ветке. Оно разделяет одну историю Git, поэтому можно запускать несколько сеансов pi параллельно, не откладывая изменения и не переключая ветки."
worktree.howto.create: "Создайте его кнопкой «Worktree»: задайте имя папки, выберите ветку и место."
worktree.howto.open: "Откройте строку, чтобы работать там. Проводник, Файлы, терминал, Git, ревью и агент следуют за этой папкой."
worktree.howto.setup: "Необязательно: добавьте .orbit/worktree-setup.sh, чтобы выполнять собственные шаги после создания, например связать .env или общий node_modules."
worktree.howto.rename: "Переименование перемещает только папку; ветка Git всегда сохраняет своё имя."
