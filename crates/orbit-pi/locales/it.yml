worktree.howto.setup: "Facoltativo: aggiungi .orbit/worktree-setup.sh per eseguire i tuoi passaggi dopo la creazione, ad esempio collegare .env o condividere node_modules."
worktree.howto.rename: "La rinomina sposta solo la cartella; il branch Git conserva sempre il suo nome."
