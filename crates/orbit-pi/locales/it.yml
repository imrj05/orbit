transcript_export.pdf_title: "Esporta come PDF"
transcript_export.pdf_preview_question: "Visualizzare l’anteprima di questo PDF nel visualizzatore PDF predefinito? Sì apre una copia temporanea in quell’app; No salta l’anteprima; Annulla interrompe l’esportazione. Orbit normalmente rimuove la copia alla chiusura; potrebbe rimanere dopo un arresto anomalo. Il visualizzatore potrebbe gestire i file secondo le proprie impostazioni."
transcript_export.pdf_preview_done: "Dopo aver controllato il PDF, scegli OK per selezionare dove salvarlo, oppure Annulla per interrompere."
transcript_export.pdf_response_disclosure: "La risposta viene resa offline con le immagini allegate. Le immagini collegate vengono omesse; le immagini animate usano il primo fotogramma. Le immagini oltre 4000 pixel in una delle due dimensioni non possono essere esportate. Alcuni caratteri potrebbero non essere disponibili; l’arabo, le scritture indiane e altri sistemi di scrittura complessi potrebbero essere visualizzati in modo errato."
transcript_export.pdf_transcript_disclosure: "Viene esportata solo la conversazione visibile; i messaggi precedenti potrebbero essere stati sostituiti da un riepilogo di compattazione. Le immagini allegate sono incluse, ma quelle collegate vengono omesse. Le immagini animate usano il primo fotogramma. Le immagini oltre 4000 pixel in una delle due dimensioni non possono essere esportate. Alcuni caratteri potrebbero non essere disponibili; l’arabo, le scritture indiane e altri sistemi di scrittura complessi potrebbero essere visualizzati in modo errato. Il rendering avviene offline."
