worktree.howto.title: "Come funzionano i worktree"
worktree.howto.intro: "Un worktree è una seconda copia di lavoro di questo repository sul proprio branch. Condivide un'unica cronologia Git, quindi puoi eseguire più sessioni pi in parallelo senza mettere da parte le modifiche né cambiare branch."
