transcript_export.pdf_preview_question: "Dieses PDF in deinem Standard-PDF-Viewer ansehen? „Ja“ öffnet eine temporäre Kopie in dieser App; „Nein“ überspringt die Vorschau; „Abbrechen“ stoppt den Export. Orbit entfernt die Kopie normalerweise beim Beenden; nach einem Absturz kann sie zurückbleiben. Der Viewer kann Dateien gemäß seinen eigenen Einstellungen behandeln."
