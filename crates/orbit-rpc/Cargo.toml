[package]
name = "orbit-rpc"
version = "0.2.18"
description = "Rust client for the pi CLI RPC protocol (pi --mode rpc)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Reads the user's current PATH, which a running process does not see change.
# Already in the dependency graph through gpui.
windows-registry = "0.5"
