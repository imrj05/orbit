
# Orbit - GPUI development configuration
# MacBook Air M4 / 16 GB RAM

default_job = "run"

[jobs.run]
command = [
    "cargo",
    "run",
    "-p", "orbit-pi",
    "-j", "4"
]
need_git_repo = false
on_change_strategy = "kill_then_restart"
watch = [
    "crates/orbit-pi/src",
    "crates/orbit-rpc/src"
]

[jobs.check]
command = [
    "cargo",
    "check",
    "-p", "orbit-pi",
    "-j", "4"
]
need_git_repo = false
watch = [
    "crates/orbit-pi/src",
    "crates/orbit-rpc/src"
]

[keybindings]
r = "job:run"
c = "job:check"
