name: Contributors

# Credit outside contributors automatically. When a pull request from someone
# who is not a maintainer is merged into main, append them to the
# [Unreleased] -> `### Contributors` list in CHANGELOG.md. A later
# `./scripts/bump-version.sh x.y.z` rolls [Unreleased] into the new release
# section, so the credit reaches the GitHub Release notes and the in-app update
# modal with no extra step. Bots and the maintainer's own pull requests are
# skipped. The push only touches CHANGELOG.md, and the release workflow watches
# crates/orbit-pi/Cargo.toml, so it never triggers a build.
#
# pull_request_target is used so the base repository's token can push; the job
# checks out main only and never the pull request head, so no untrusted code
# runs. If main ever gains branch protection, switch the push for a bot PR
# (peter-evans/create-pull-request) or add the bot to the bypass list.

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to credit
        required: true
      login:
        description: Contributor's GitHub login
        required: true

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  credit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve contributor
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ASSOC: ${{ github.event.pull_request.author_association }}
          LOGIN: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          MANUAL_PR: ${{ inputs.pr }}
          MANUAL_LOGIN: ${{ inputs.login }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pr="$MANUAL_PR"
            login="$MANUAL_LOGIN"
            title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .title)"
          else
            pr="$PR"
            login="$LOGIN"
            title="$TITLE"
            case "$ASSOC" in
              OWNER|MEMBER|COLLABORATOR)
                echo "::notice::$login is a maintainer; skipping"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            case "$login" in
              *"[bot]"|dependabot|renovate)
                echo "::notice::$login is a bot; skipping"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          {
            echo "skip=false"
            echo "pr=$pr"
            echo "login=$login"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Credit the contributor in CHANGELOG.md
        if: steps.who.outputs.skip != 'true'
        env:
          PR: ${{ steps.who.outputs.pr }}
          LOGIN: ${{ steps.who.outputs.login }}
          TITLE: ${{ steps.who.outputs.title }}
        run: |
          set -euo pipefail
          python3 scripts/changelog-contributors.py \
            --pr "$PR" --login "$LOGIN" --title "$TITLE"

      - name: Commit and push
        if: steps.who.outputs.skip != 'true'
        env:
          PR: ${{ steps.who.outputs.pr }}
          LOGIN: ${{ steps.who.outputs.login }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md already credits #$PR"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): credit @$LOGIN for #$PR [skip ci]"
          # HEAD:main works whether checkout left a local branch or a detached
          # HEAD. Rebase once in case a human push landed after checkout.
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
