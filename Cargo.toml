[workspace]
resolver = "2"
members = [
    "crates/orbit-pi",
    "crates/orbit-rpc",
]
# Vendored gpui 0.2.2 with the backdrop-blur patch (see vendor/gpui/README.orbit.md).
exclude = ["vendor/gpui"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/imrj05/orbit"

# The backdrop-blur pass has no upstream equivalent in gpui 0.2.2: a quad that
# carries `gpui::backdrop_blur_marker(sigma)` asks the Metal renderer to blur
# what is already drawn behind it before painting, like CSS
# `backdrop-filter: blur()`. The patch is confined to the macOS renderer, the
# shader source and the marker in `scene.rs`; everything else is the published
# crate.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Faster debug builds at the expense of runtime performance — fine for a
# rendering spike. Drop this when measuring real-world perf.
[profile.dev]
opt-level = 1
# Incremental codegen for this crate has emitted object files whose internal
# LLVM symbols no longer match its dependencies' rlibs, failing the final link
# with `ld: symbol(s) not found for architecture arm64`. Build non-incrementally
# so `cargo build`/`bacon` links reliably; a from-scratch app rebuild is ~25s.
incremental = false
